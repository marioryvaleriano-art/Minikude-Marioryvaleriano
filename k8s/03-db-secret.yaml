# Secret para credenciales sensibles de MongoDB
# Los valores están codificados en Base64 por seguridad
# IMPORTANTE: En producción, gestionar estos secretos de forma más segura

apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s11
  labels:
    app: mongo
    tier: database
type: Opaque
data:
  # Usuario root de MongoDB (adminmongo en Base64)
  # Para generar en PowerShell:
  # [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("adminmongo"))
  MONGO_INITDB_ROOT_USERNAME: YWRtaW5tb25nbw==
  
  # Contraseña de MongoDB (mongo2024 en Base64)
  # Para generar en PowerShell:
  # [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("mongo2024"))
  MONGO_INITDB_ROOT_PASSWORD: bW9uZ28yMDI0

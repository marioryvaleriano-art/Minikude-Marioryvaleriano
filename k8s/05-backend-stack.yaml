# Stack completo del Backend: Deployment + Service (NodePort)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: practica-s11
  labels:
    app: backend
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: application
    spec:
      containers:
      - name: backend
        image: mariory/springwebflux-s11:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8085
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-secret
        env:
        - name: SPRING_DATA_MONGODB_URI
          value: "mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?authSource=admin"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:sqlserver://192.168.18.10:1433;databaseName=BodegaPeiranoDBF;encrypt=false;trustServerCertificate=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "sa"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: SQL_PASSWORD
        resources:
          limits:
            memory: "1Gi"
            cpu: "1"
          requests:
            memory: "512Mi"
            cpu: "250m"
        startupProbe:
          tcpSocket:
            port: 8085
          periodSeconds: 10
          failureThreshold: 18
        readinessProbe:
          tcpSocket:
            port: 8085
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 8085
          periodSeconds: 15
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s11
  labels:
    app: backend
    tier: application
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - port: 8085
    targetPort: 8085
    nodePort: 30085
    protocol: TCP
    name: http
